name: Build unsigned IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: unzip -q VibrationTest-source.zip -d project
      - name: Build iPhone app
        run: |
          xcodebuild -project project/VibrationTest.xcodeproj -target VibrationTest             -configuration Release -sdk iphoneos             CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/vibration-build"             CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$RUNNER_TEMP/vibration-build/VibrationTest.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/VibrationTest-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VibrationTest-unsigned
          path: VibrationTest-unsigned.ipa
          if-no-files-found: error
